{% extends 'inventario/base.html' %}
{% block title %}Municipios{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-geo-alt"></i> Municipios</h4>
    <a href="{% url 'municipio_create' %}" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle"></i> Nuevo municipio
    </a>
</div>
<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Centro</th>
                    </tr>
                </thead>
                <tbody>
                    {% for m in municipios %}
                        <tr>
                            <td>{{ m.nombre }}</td>
                            <td>{{ m.centro.nombre|default:'—' }}</td>
                        </tr>
                    {% empty %}
                        <tr><td colspan="2" class="text-center text-muted py-4">Sin municipios registrados</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
